<!DOCTYPE html>
<html>
<head>
  <title>Livello Finale</title>
</head>

<body style="margin:0; font-family:'Courier New', monospace; line-height:1.6; color:#66ffcc; background: radial-gradient(circle at top, rgba(0,255,255,0.08), transparent 20%), linear-gradient(180deg, #020202 0%, #080808 40%, #020202 100%);">

<h2 style="text-align:center; margin-top:40px; font-size:2rem; letter-spacing:0.15em; color:#ffffff; text-shadow:0 0 18px rgba(0,255,255,0.65);">
ACCESSO LIMITATO
</h2>

<div style="max-width:600px; margin:40px auto; background: rgba(12,14,22,0.95); border:1px solid rgba(0,255,213,0.22); box-shadow:0 0 30px rgba(0,255,213,0.08); padding:30px;">

  <p style="color:#ff4dfd; letter-spacing:0.1em;">&gt; ERROR 403</p>
  <p style="color:#9ef0ff;">&gt; hint: the answer is in the error</p>

  <br>

  <div style="text-align:center;">
    <input id="pass" placeholder="Inserisci codice"
      style="padding:10px; background:black; border:1px solid #00ffd5; color:#00ffd5; outline:none; width:70%;">

    <br><br>

    <button onclick="check()"
      style="padding:10px 20px; background:transparent; border:1px solid #00ffd5; color:#00ffd5; cursor:pointer; letter-spacing:0.1em;">
      INVIA
    </button>
  </div>

</div>

<script>
function check() {
  let p = document.getElementById("pass").value.toLowerCase();

  if(p === "403") {
    window.location.href = "finale.html";
  } else {
    alert("❌ Errore!");
  }
}
</script>

</body>
</html>
